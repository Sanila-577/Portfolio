<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sanila Wijesekara · AI Engineer</title>
    <meta
      name="description"
      content="Sanila Wijesekara — AI Engineer intern at OCTAVE (John Keells Group), co-founder of RiceVision, and CS undergraduate building agentic AI, computer vision and data systems."
    />
    <meta name="theme-color" content="#0a0e1a" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sanila Wijesekara · AI Engineer" />
    <meta
      property="og:description"
      content="Agentic AI, computer vision and data engineering — plus a lifelong love of astrophysics."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Set the theme before first paint so there is no flash of the wrong theme. -->
    <script>
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        // Dark is the default; light only if the visitor chose it before.
        if (theme !== 'light') theme = 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
